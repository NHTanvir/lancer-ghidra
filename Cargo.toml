[package]
name = "lancer-ghidra"
version = "0.1.0"
edition = "2021"
description = "Rust clone of ghidra — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-ghidra"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Binary parsing
goblin = "0.10"
memmap2 = "0.9"

# Disassemblers
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel", "gas", "masm", "nasm", "instr_info"] }
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.3"

# Debug info
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
pdb = "0.8"

# Demanglers
cpp_demangle = "0.4"
msvc-demangler = "0.10"
rustc-demangle = "0.1"

# Graph / data structures
petgraph = "0.6"
indexmap = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
regex = "1"
hex = "0.4"
sha2 = "0.10"

# Project database
redb = "2"

# Scripting
rhai = { version = "1", features = ["sync"] }

# WASM parsing
wasmparser = "0.224"

# HTTP client for LLM API
ureq = { version = "2", features = ["tls", "json"] }

# Embedded web server
tiny_http = "0.12"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
